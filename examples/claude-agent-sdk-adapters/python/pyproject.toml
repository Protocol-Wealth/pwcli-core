[project]
name = "pwcli-claude-agent-sdk-reference"
version = "0.1.0"
description = "Governed read-only Claude Agent SDK reference adapter for pwcli-core"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk==0.2.128"
]

[project.scripts]
pwcli-claude-review = "pwcli_claude_adapter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwcli_claude_adapter"]

[tool.hatch.build.targets.wheel.force-include]
"../fixtures" = "pwcli_claude_adapter/fixtures"
